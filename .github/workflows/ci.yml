name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Detect API source
        id: detect
        run: |
          if find services/api -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Skipping API checks: services/api contains only .gitkeep."
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_code == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.has_code == 'true'
        run: |
          python -m pip install --upgrade pip ruff mypy pytest
          if [ -f services/api/requirements.txt ]; then
            python -m pip install -r services/api/requirements.txt
          fi
          if [ -f services/api/requirements-dev.txt ]; then
            python -m pip install -r services/api/requirements-dev.txt
          fi

      - name: Ruff check
        if: steps.detect.outputs.has_code == 'true'
        run: ruff check services/api services/engine

      - name: Mypy
        if: steps.detect.outputs.has_code == 'true'
        run: mypy services/api services/engine

      - name: Pytest
        if: steps.detect.outputs.has_code == 'true'
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Detect web source
        id: detect
        run: |
          if find apps/web -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web checks: apps/web contains only .gitkeep."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.has_code == 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npm test
