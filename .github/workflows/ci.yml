name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      neo4j:
        image: neo4j:5.26.31-community
        env:
          NEO4J_AUTH: neo4j/change-me
        ports:
          - 7687:7687
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/7687'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect API source
        id: detect
        run: |
          if find services/api -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Skipping API checks: services/api contains only .gitkeep."
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_code == 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.has_code == 'true'
        run: |
          python -m pip install --upgrade pip ruff mypy pytest
          if [ -f services/api/requirements.txt ]; then
            python -m pip install -r services/api/requirements.txt
          fi
          if [ -f services/api/requirements-dev.txt ]; then
            python -m pip install -r services/api/requirements-dev.txt
          fi

      - name: Ruff check
        if: steps.detect.outputs.has_code == 'true'
        run: ruff check services/api

      - name: Mypy
        if: steps.detect.outputs.has_code == 'true'
        run: cd services/api && mypy app tests

      - name: Pytest
        if: steps.detect.outputs.has_code == 'true'
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: change-me
          NEO4J_REQUIRED: "true"
        run: cd services/api && PYTHONPATH=. pytest

  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect web source
        id: detect
        run: |
          if find apps/web -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web checks: apps/web contains only .gitkeep."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.has_code == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test
        if: steps.detect.outputs.has_code == 'true'
        working-directory: apps/web
        run: npm test
